name: Test and release

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python tests/test_follow_bulk.py

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install pyinstaller==6.20.0
      - run: python scripts/build_exe.py
      - run: python scripts/smoke_exe.py
      - run: python scripts/package_release.py v0.2.0
      - name: Publish v0.2.0 once
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v0.2.0 >/dev/null 2>&1; then
            gh release create v0.2.0 dist/pixiv-gallery-v0.2.0.zip dist/pixiv-gallery.exe \
              --target "$GITHUB_SHA" \
              --title "画屿 v0.2.0" \
              --notes-file RELEASE_NOTES.md
          fi
