name: Test and release

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python tests/test_follow_bulk.py
      - run: python tests/test_discovery.py
      - run: python tests/test_appearance.py
      - run: python tests/test_local_open.py

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-build.txt
      - run: python scripts/build_exe.py
      - run: python scripts/smoke_exe.py
      - run: python scripts/package_release.py v0.5.1
      - run: Copy-Item dist/pixiv-gallery.exe dist/huayu.exe
      - name: Publish v0.5.1 once
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v0.5.1 >/dev/null 2>&1; then
            gh release create v0.5.1 dist/pixiv-gallery-v0.5.1.zip dist/pixiv-gallery.exe dist/huayu.exe \
              --target "$GITHUB_SHA" \
              --title "画屿 v0.5.1" \
              --notes-file RELEASE_NOTES.md
          fi
